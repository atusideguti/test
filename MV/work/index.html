<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Dela Gothic One';src:url(fonts/dela.woff2)}
@font-face{font-family:'Shippori Mincho B1';font-weight:800;src:url(fonts/shippori.woff2)}
html,body{margin:0;background:#000}canvas{display:block}
</style></head><body><canvas id="c"></canvas>
<script>const VER=new URLSearchParams(location.search).get('v')||'v1';document.write('<script src="env_'+VER+'.js"><\/script>');</script>
<script src="engine.js"></script><script src="v1.js"></script><script src="v2.js"></script>
<script>
window.READY=false;
Promise.all([document.fonts.load('100px "Dela Gothic One"',"ガ"),document.fonts.load('800 100px "Shippori Mincho B1"',"熱")]).then(()=>{window.READY=true});
window.renderAt=function(t){ctx.globalAlpha=1;ctx.filter='none';const V=(VER==='v1'?V1:V2);const fx=V.draw(t)||{};V.post(t,fx);};
</script></body></html>
